name: Sync official ranking

on:
  schedule:
    # 12:00 JST every day (03:00 UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-ranking
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Glucoseman rank and points from yurugp.jp
        run: node scripts/update-campaign-data.mjs
      - name: Save the latest official values
        run: |
          if git diff --quiet -- app/campaign-data.json; then
            echo "Official values are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/campaign-data.json
          git commit -m "Update official Glucoseman ranking"
          git push
