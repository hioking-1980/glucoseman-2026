name: Sync official ranking

on:
  schedule:
    # Off-peak retries after the official weekday noon update. GitHub may drop
    # scheduled events under load, especially near the start of an hour.
    - cron: "17,37,57 3,4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-official-ranking
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Glucoseman rank and points from yurugp.jp
        run: node scripts/update-campaign-data.mjs
      - name: Save the latest official values
        id: save
        run: |
          if git diff --quiet -- app/campaign-data.json; then
            echo "Official values are unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/campaign-data.json
          git commit -m "Update official Glucoseman ranking"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republish GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
